[project]
name = "medrag"
version = "0.1.0"
description = "High-precision Medical RAG system — Privacy-First Hybrid RAG (Local Vector Storage + Optional Cloud Reasoning)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # OCR & PDF parsing
    "chandra-ocr>=0.2.0",       # SOTA vision-language OCR (Chandra OCR 2)
    "pymupdf>=1.24.0",           # Fast fallback for text-based PDFs

    # Embeddings
    "sentence-transformers>=3.0.0",

    # Vector database
    "lancedb>=0.6.0",
    "tantivy>=0.22.0",

    # LLM client (connects to LM Studio)
    "openai>=1.30.0",

    # Web server
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "python-multipart>=0.0.9",
    "websockets>=12.0",
    "sse-starlette>=2.0.0",

    # HTTP client (MedGen/HPO sync — also shipped by openai, declared explicitly)
    "httpx>=0.27.0",

    # CLI & utilities
    "rich>=13.7.0",
    "typer>=0.12.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
amd = [
    "torch-directml>=0.2.0",     # AMD GPU DirectML backend for PyTorch
]
marker = [
    "marker-pdf>=1.6.0",         # Alternative ML-based OCR (has heavy deps)
]
download = [
    "fpdf2>=2.7.0",              # Synthetic medical PDF generation
]
corpus = [
    "datasets>=2.19.0",          # Hugging Face datasets for MedRAG corpus
]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]

[project.scripts]
medrag = "medrag.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true