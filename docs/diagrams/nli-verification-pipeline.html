<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MedRAG v2.0 - Deterministic NLI Verification Pipeline</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #e5e5e5;
      font-family: 'Geist', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 24px;
    }
    .diagram-container {
      background: #f5f5f5;
      box-shadow: 0 4px 24px rgba(0,0,0,0.08);
      border-radius: 8px;
      overflow: hidden;
      width: 100%;
      max-width: 960px;
    }
    svg { display: block; width: 100%; height: auto; }
  </style>
</head>
<body>
  <div class="diagram-container">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" role="img" aria-labelledby="d2-title d2-desc">
      <defs>
        <style>
          @import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap');
          .title { font-family: 'Instrument Serif', Georgia, serif; font-size: 28px; fill: #2d3142; }
          .subtitle { font-family: 'Geist', sans-serif; font-size: 12px; fill: #4f5d75; }
          .node-tag { font-family: 'Geist Mono', monospace; font-size: 7px; letter-spacing: 0.08em; font-weight: 500; }
          .node-title { font-family: 'Geist', sans-serif; font-size: 12px; font-weight: 600; fill: #2d3142; }
          .node-sub { font-family: 'Geist Mono', monospace; font-size: 9px; fill: #4f5d75; }
          .edge-label { font-family: 'Geist Mono', monospace; font-size: 8px; letter-spacing: 0.06em; fill: #4f5d75; font-weight: 500; }
          .legend-text { font-family: 'Geist Mono', monospace; font-size: 8px; letter-spacing: 0.08em; fill: #4f5d75; }
        </style>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/>
        </marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/>
        </marker>
        <marker id="arrow-danger" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#f43f5e"/>
        </marker>
        <marker id="arrow-success" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#10b981"/>
        </marker>
      </defs>

      <title id="d2-title">MedRAG v2.0 - Deterministic NLI Verification Pipeline</title>
      <desc id="d2-desc">Sentence-level DeBERTa-v3 cross-encoder evaluation with automated contradiction redaction and CMO override review.</desc>

      <!-- 1. Background -->
      <rect width="960" height="600" fill="#f5f5f5"/>

      <!-- Header -->
      <text x="40" y="44" class="title">MedRAG v2.0: Deterministic NLI Claim Verification Pipeline</text>
      <text x="40" y="68" class="subtitle">Sentence-level DeBERTa-v3 cross-encoder audit: P(Contradiction) &ge; 0.60 triggers automatic redaction with safety tombstones.</text>

      <!-- 2. Connectors (Drawn first so lines sit behind boxes) -->
      <!-- Step 1 to Step 2 (Horizontal) -->
      <line x1="184" y1="168" x2="240" y2="168" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="194" y="152" width="36" height="12" rx="2" fill="#f5f5f5"/>
      <text x="212" y="161" class="edge-label" text-anchor="middle">PROMPT</text>

      <!-- Step 2 to Step 3 (Horizontal) -->
      <line x1="400" y1="168" x2="456" y2="168" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="410" y="152" width="42" height="12" rx="2" fill="#f5f5f5"/>
      <text x="431" y="161" class="edge-label" text-anchor="middle">CHUNKS</text>

      <!-- Step 3 to Step 4 (Horizontal) -->
      <line x1="616" y1="168" x2="672" y2="168" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="626" y="152" width="38" height="12" rx="2" fill="#f5f5f5"/>
      <text x="645" y="161" class="edge-label" text-anchor="middle">STREAM</text>

      <!-- Step 4 to Step 5 (Vertical down) -->
      <line x1="792" y1="200" x2="792" y2="256" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
      <rect x="768" y="220" width="48" height="12" rx="2" fill="#f5f5f5"/>
      <text x="792" y="229" class="edge-label" fill="#eb6c36" text-anchor="middle">CLAIMS [^N]</text>

      <!-- Step 5 to Step 6 (Horizontal left) -->
      <line x1="672" y1="292" x2="608" y2="292" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
      <rect x="620" y="276" width="44" height="12" rx="2" fill="#f5f5f5"/>
      <text x="642" y="285" class="edge-label" fill="#eb6c36" text-anchor="middle">NLI PROBS</text>

      <!-- Decision Gate (Step 6) to Redaction (Elbow left-down) -->
      <!-- from (384, 292) to (240, 380), mid = 240 -->
      <path d="M 384,292 H 248 Q 240,292 240,300 V 380" fill="none" stroke="#f43f5e" stroke-width="1.4" marker-end="url(#arrow-danger)"/>
      <rect x="252" y="324" width="88" height="12" rx="2" fill="#f5f5f5"/>
      <text x="296" y="333" class="edge-label" fill="#f43f5e" text-anchor="middle">P(CONTRA) &ge; 0.60</text>

      <!-- Redaction to CMO Override (Vertical) -->
      <line x1="240" y1="444" x2="240" y2="476" stroke="#f43f5e" stroke-width="1.2" marker-end="url(#arrow-danger)"/>
      <rect x="204" y="452" width="72" height="12" rx="2" fill="#f5f5f5"/>
      <text x="240" y="461" class="edge-label" fill="#f43f5e" text-anchor="middle">AUDIT ALERT</text>

      <!-- Decision Gate to Verified Anchor (Elbow down-right) -->
      <!-- from (500, 324) to (560, 380) -->
      <path d="M 500,324 V 344 Q 500,352 508,352 H 552 Q 560,352 560,360 V 380" fill="none" stroke="#10b981" stroke-width="1.4" marker-end="url(#arrow-success)"/>
      <rect x="510" y="346" width="84" height="12" rx="2" fill="#f5f5f5"/>
      <text x="552" y="355" class="edge-label" fill="#10b981" text-anchor="middle">P(CONTRA) &lt; 0.60</text>

      <!-- Verified Anchor to Final Output (Vertical) -->
      <line x1="560" y1="444" x2="560" y2="476" stroke="#10b981" stroke-width="1.2" marker-end="url(#arrow-success)"/>
      <rect x="526" y="452" width="68" height="12" rx="2" fill="#f5f5f5"/>
      <text x="560" y="461" class="edge-label" fill="#10b981" text-anchor="middle">VERIFIED</text>

      <!-- CMO Override to Final Output (Horizontal, dashed) -->
      <line x1="360" y1="504" x2="440" y2="504" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <rect x="372" y="492" width="56" height="12" rx="2" fill="#f5f5f5"/>
      <text x="400" y="501" class="edge-label" text-anchor="middle">OVERRIDDEN</text>

      <!-- 3. Nodes -->
      
      <!-- Step 1: Clinical Query -->
      <rect x="40" y="136" width="144" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="40" y="136" width="144" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="48" y="142" width="36" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.3)" stroke-width="0.8"/>
      <text x="66" y="151" class="node-tag" fill="#4f5d75" text-anchor="middle">INPUT</text>
      <text x="112" y="167" class="node-title" text-anchor="middle">Clinical Query</text>
      <text x="112" y="183" class="node-sub" text-anchor="middle">Patient ID + Question</text>

      <!-- Step 2: Hybrid Retrieval -->
      <rect x="240" y="136" width="160" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="240" y="136" width="160" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="248" y="142" width="48" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.3)" stroke-width="0.8"/>
      <text x="272" y="151" class="node-tag" fill="#4f5d75" text-anchor="middle">RETRIEVE</text>
      <text x="320" y="167" class="node-title" text-anchor="middle">Hybrid Search (RRF)</text>
      <text x="320" y="183" class="node-sub" text-anchor="middle">BM25 + Arrow Cosine</text>

      <!-- Step 3: LLM Synthesis Stream -->
      <rect x="456" y="136" width="160" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="456" y="136" width="160" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="464" y="142" width="56" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.3)" stroke-width="0.8"/>
      <text x="492" y="151" class="node-tag" fill="#4f5d75" text-anchor="middle">SYNTHESIS</text>
      <text x="536" y="167" class="node-title" text-anchor="middle">Clinical LLM Stream</text>
      <text x="536" y="183" class="node-sub" text-anchor="middle">Tokens with Inline Citations</text>

      <!-- Step 4: Sentence Claim Splitter -->
      <rect x="672" y="136" width="240" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="672" y="136" width="240" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="680" y="142" width="60" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.3)" stroke-width="0.8"/>
      <text x="710" y="151" class="node-tag" fill="#4f5d75" text-anchor="middle">DECOMPOSE</text>
      <text x="792" y="167" class="node-title" text-anchor="middle">Sentence Tokenizer</text>
      <text x="792" y="183" class="node-sub" text-anchor="middle">Maps Assertions to Evidence IDs</text>

      <!-- Step 5: DeBERTa-v3 Cross-Encoder (FOCAL 1) -->
      <rect x="672" y="256" width="240" height="72" rx="6" fill="#f5f5f5"/>
      <rect x="672" y="256" width="240" height="72" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.5"/>
      <rect x="680" y="262" width="68" height="12" rx="2" fill="transparent" stroke="rgba(235,108,54,0.4)" stroke-width="0.8"/>
      <text x="714" y="271" class="node-tag" fill="#eb6c36" text-anchor="middle">INFERENCE ENGINE</text>
      <text x="792" y="288" class="node-title" text-anchor="middle">DeBERTa-v3 NLI Model</text>
      <text x="792" y="304" class="node-sub" text-anchor="middle">Calculates Entailment &amp; Contradiction</text>
      <text x="792" y="318" class="node-sub" fill="#eb6c36" text-anchor="middle">Softmax Distribution Across Labels</text>

      <!-- Step 6: Decision Gate -->
      <rect x="384" y="260" width="224" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="384" y="260" width="224" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="392" y="266" width="60" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.3)" stroke-width="0.8"/>
      <text x="422" y="275" class="node-tag" fill="#4f5d75" text-anchor="middle">THRESHOLD</text>
      <text x="496" y="291" class="node-title" text-anchor="middle">Contradiction Decision Gate</text>
      <text x="496" y="307" class="node-sub" text-anchor="middle">Evaluate &tau; = 0.60 Contradiction Risk</text>

      <!-- Step 7A: Automatic Safety Redaction (FOCAL 2) -->
      <rect x="120" y="380" width="240" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="120" y="380" width="240" height="64" rx="6" fill="rgba(244,63,94,0.08)" stroke="#f43f5e" stroke-width="1.5"/>
      <rect x="128" y="386" width="76" height="12" rx="2" fill="transparent" stroke="rgba(244,63,94,0.4)" stroke-width="0.8"/>
      <text x="166" y="395" class="node-tag" fill="#f43f5e" text-anchor="middle">SAFETY REDACT</text>
      <text x="240" y="411" class="node-title" text-anchor="middle">Safety Tombstone Redaction</text>
      <text x="240" y="427" class="node-sub" fill="#f43f5e" text-anchor="middle">[REDACTED: Contradicts Clinical Source]</text>

      <!-- Step 7B: CMO Override Review -->
      <rect x="120" y="476" width="240" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="120" y="476" width="240" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="128" y="482" width="68" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.3)" stroke-width="0.8"/>
      <text x="162" y="491" class="node-tag" fill="#4f5d75" text-anchor="middle">FOUR-EYES</text>
      <text x="240" y="507" class="node-title" text-anchor="middle">CMO Override Review</text>
      <text x="240" y="522" class="node-sub" text-anchor="middle">Logged to HIPAA Audit Ledger</text>

      <!-- Step 7C: Verified Claim Anchor -->
      <rect x="440" y="380" width="240" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="440" y="380" width="240" height="64" rx="6" fill="rgba(16,185,129,0.08)" stroke="#10b981" stroke-width="1.5"/>
      <rect x="448" y="386" width="68" height="12" rx="2" fill="transparent" stroke="rgba(16,185,129,0.4)" stroke-width="0.8"/>
      <text x="482" y="395" class="node-tag" fill="#10b981" text-anchor="middle">EVAL VERIFIED</text>
      <text x="560" y="411" class="node-title" text-anchor="middle">Verified Footnote Anchor</text>
      <text x="560" y="427" class="node-sub" fill="#10b981" text-anchor="middle">Bound to Harrison&apos;s / KDIGO [^1]</text>

      <!-- Step 8: Audited Synthesis Delivery -->
      <rect x="440" y="476" width="472" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="440" y="476" width="472" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="448" y="482" width="60" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.3)" stroke-width="0.8"/>
      <text x="478" y="491" class="node-tag" fill="#4f5d75" text-anchor="middle">DELIVERY</text>
      <text x="676" y="506" class="node-title" text-anchor="middle">Audited Clinical Synthesis Stream</text>
      <text x="676" y="521" class="node-sub" text-anchor="middle">Zero Hallucinations · Real-Time Token Streaming · Clinician Workspace</text>

      <!-- 4. Legend Strip at Bottom -->
      <line x1="40" y1="556" x2="920" y2="556" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
      <text x="40" y="578" class="legend-text" font-weight="600" letter-spacing="0.14em">LEGEND</text>
      
      <rect x="120" y="570" width="12" height="12" rx="2" fill="rgba(235,108,54,0.15)" stroke="#eb6c36" stroke-width="1.2"/>
      <text x="140" y="579" class="legend-text">NLI Cross-Encoder Core</text>

      <rect x="330" y="570" width="12" height="12" rx="2" fill="rgba(244,63,94,0.15)" stroke="#f43f5e" stroke-width="1.2"/>
      <text x="350" y="579" class="legend-text">Contradiction Redacted</text>

      <rect x="550" y="570" width="12" height="12" rx="2" fill="rgba(16,185,129,0.15)" stroke="#10b981" stroke-width="1.2"/>
      <text x="570" y="579" class="legend-text">Entailed / Footnote Grounded</text>

      <line x1="780" y1="576" x2="804" y2="576" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <text x="812" y="579" class="legend-text">Human-in-the-Loop Override</text>
    </svg>
  </div>
</body>
</html>
