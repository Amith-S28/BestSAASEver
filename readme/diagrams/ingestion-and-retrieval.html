<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MedRAG v2.0 - Dual Ingestion &amp; Hybrid Retrieval Engine</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #e5e5e5;
      font-family: 'Geist', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 24px;
    }
    .diagram-container {
      background: #f5f5f5;
      box-shadow: 0 4px 24px rgba(0,0,0,0.08);
      border-radius: 8px;
      overflow: hidden;
      width: 100%;
      max-width: 960px;
    }
    svg { display: block; width: 100%; height: auto; }
  </style>
</head>
<body>
  <div class="diagram-container">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" role="img" aria-labelledby="d3-title d3-desc">
      <defs>
        <style>
          @import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap');
          .title { font-family: 'Instrument Serif', Georgia, serif; font-size: 28px; fill: #2d3142; }
          .subtitle { font-family: 'Geist', sans-serif; font-size: 12px; fill: #4f5d75; }
          .zone-tag { font-family: 'Geist Mono', monospace; font-size: 8px; letter-spacing: 0.14em; fill: #7a8399; font-weight: 600; }
          .node-tag { font-family: 'Geist Mono', monospace; font-size: 7px; letter-spacing: 0.08em; font-weight: 500; }
          .node-title { font-family: 'Geist', sans-serif; font-size: 12px; font-weight: 600; fill: #2d3142; }
          .node-sub { font-family: 'Geist Mono', monospace; font-size: 9px; fill: #4f5d75; }
          .edge-label { font-family: 'Geist Mono', monospace; font-size: 8px; letter-spacing: 0.06em; fill: #4f5d75; font-weight: 500; }
          .legend-text { font-family: 'Geist Mono', monospace; font-size: 8px; letter-spacing: 0.08em; fill: #4f5d75; }
        </style>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/>
        </marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/>
        </marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/>
        </marker>
      </defs>

      <title id="d3-title">MedRAG v2.0 - Dual Ingestion &amp; Hybrid Retrieval Engine</title>
      <desc id="d3-desc">Data flow diagram showing FHIR and PDF ingestion through compound tenant security boundaries into LanceDB Arrow and Tantivy BM25.</desc>

      <!-- 1. Background -->
      <rect width="960" height="600" fill="#f5f5f5"/>

      <!-- Header -->
      <text x="40" y="44" class="title">MedRAG v2.0: Dual-Track Ingestion &amp; Hybrid Retrieval</text>
      <text x="40" y="68" class="subtitle">HL7 FHIR R4 atomic encounter timelines fused with layout-aware PDF lab parsing and sub-10ms LanceDB + Tantivy RRF search.</text>

      <!-- 2. Connectors (Drawn before nodes) -->
      <!-- Track 1 (FHIR) to Gate (Elbow right-down) -->
      <!-- from (260, 168) to (308, 220), mid = 284 -->
      <path d="M 260,168 H 276 Q 284,168 284,176 V 212 Q 284,220 292,220 H 308" fill="none" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <rect x="264" y="190" width="40" height="12" rx="2" fill="#f5f5f5"/>
      <text x="284" y="199" class="edge-label" fill="#2e5aa8" text-anchor="middle">FHIR R4</text>

      <!-- Track 2 (PDF) to Gate (Elbow right-up) -->
      <!-- from (260, 272) to (308, 220), mid = 284 -->
      <path d="M 260,272 H 276 Q 284,272 284,264 V 228 Q 284,220 292,220 H 308" fill="none" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <rect x="266" y="240" width="36" height="12" rx="2" fill="#f5f5f5"/>
      <text x="284" y="249" class="edge-label" fill="#2e5aa8" text-anchor="middle">PDF LAB</text>

      <!-- Gate to LanceDB Dense Store (Elbow right-up) -->
      <!-- from (492, 220) to (540, 168), mid = 516 -->
      <path d="M 492,220 H 508 Q 516,220 516,212 V 176 Q 516,168 524,168 H 540" fill="none" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
      <rect x="496" y="190" width="40" height="12" rx="2" fill="#f5f5f5"/>
      <text x="516" y="199" class="edge-label" fill="#eb6c36" text-anchor="middle">VECTORS</text>

      <!-- Gate to Tantivy Sparse Store (Elbow right-down) -->
      <!-- from (492, 220) to (540, 272), mid = 516 -->
      <path d="M 492,220 H 508 Q 516,220 516,228 V 264 Q 516,272 524,272 H 540" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="498" y="240" width="36" height="12" rx="2" fill="#f5f5f5"/>
      <text x="516" y="249" class="edge-label" text-anchor="middle">TOKENS</text>

      <!-- Gate to Entity Linker (Vertical down) -->
      <line x1="400" y1="256" x2="400" y2="348" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="372" y="294" width="56" height="12" rx="2" fill="#f5f5f5"/>
      <text x="400" y="303" class="edge-label" text-anchor="middle">ONTOLOGY</text>

      <!-- Entity Linker to RRF Fusion (Horizontal) -->
      <line x1="492" y1="380" x2="540" y2="380" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="500" y="366" width="32" height="12" rx="2" fill="#f5f5f5"/>
      <text x="516" y="375" class="edge-label" text-anchor="middle">LOINC</text>

      <!-- LanceDB to RRF (Vertical down) -->
      <line x1="650" y1="200" x2="650" y2="348" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
      <rect x="626" y="266" width="48" height="12" rx="2" fill="#f5f5f5"/>
      <text x="650" y="275" class="edge-label" fill="#eb6c36" text-anchor="middle">DENSE RANK</text>

      <!-- Tantivy to RRF (Vertical down) -->
      <line x1="680" y1="304" x2="680" y2="348" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="656" y="320" width="48" height="12" rx="2" fill="#f5f5f5"/>
      <text x="680" y="329" class="edge-label" text-anchor="middle">BM25 RANK</text>

      <!-- RRF to Output (Elbow down-left) -->
      <!-- from (650, 412) to (534, 456) -->
      <path d="M 650,412 V 430 Q 650,438 642,438 H 542 Q 534,438 534,446 V 456" fill="none" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <rect x="560" y="432" width="64" height="12" rx="2" fill="#f5f5f5"/>
      <text x="592" y="441" class="edge-label" fill="#eb6c36" text-anchor="middle">FUSED (k=60)</text>

      <!-- 3. Nodes -->
      
      <!-- Track 1: HL7 FHIR Bundle -->
      <rect x="40" y="136" width="220" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="40" y="136" width="220" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="48" y="142" width="60" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.3)" stroke-width="0.8"/>
      <text x="78" y="151" class="node-tag" fill="#4f5d75" text-anchor="middle">TRACK 1: FHIR</text>
      <text x="150" y="167" class="node-title" text-anchor="middle">HL7 FHIR R4 Ingestion</text>
      <text x="150" y="183" class="node-sub" text-anchor="middle">Atomic Encounter Chronology</text>

      <!-- Track 2: Diagnostic Lab PDF -->
      <rect x="40" y="240" width="220" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="40" y="240" width="220" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="48" y="246" width="56" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.3)" stroke-width="0.8"/>
      <text x="76" y="255" class="node-tag" fill="#4f5d75" text-anchor="middle">TRACK 2: PDF</text>
      <text x="150" y="271" class="node-title" text-anchor="middle">Diagnostic Lab PDF Parser</text>
      <text x="150" y="287" class="node-sub" text-anchor="middle">Layout-Aware Bounding Boxes</text>

      <!-- Central Gate: Tenant Isolation & De-identification (FOCAL 1) -->
      <rect x="308" y="184" width="184" height="72" rx="6" fill="#f5f5f5"/>
      <rect x="308" y="184" width="184" height="72" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.5"/>
      <rect x="316" y="190" width="68" height="12" rx="2" fill="transparent" stroke="rgba(235,108,54,0.4)" stroke-width="0.8"/>
      <text x="350" y="199" class="node-tag" fill="#eb6c36" text-anchor="middle">TRUST GATEWAY</text>
      <text x="400" y="216" class="node-title" text-anchor="middle">Tenant Isolation Gate</text>
      <text x="400" y="232" class="node-sub" text-anchor="middle">Compound Query Predicate</text>
      <text x="400" y="246" class="node-sub" fill="#eb6c36" text-anchor="middle">HIPAA Safe Harbor De-ID</text>

      <!-- Storage 1: LanceDB Arrow Vector Table -->
      <rect x="540" y="136" width="220" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="540" y="136" width="220" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="548" y="142" width="64" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.3)" stroke-width="0.8"/>
      <text x="580" y="151" class="node-tag" fill="#4f5d75" text-anchor="middle">DENSE VECTOR</text>
      <text x="650" y="167" class="node-title" text-anchor="middle">LanceDB Arrow Database</text>
      <text x="650" y="183" class="node-sub" text-anchor="middle">Zero-Copy In-Process Memory</text>

      <!-- Storage 2: Tantivy BM25 Lexical Index -->
      <rect x="540" y="240" width="220" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="540" y="240" width="220" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="548" y="246" width="64" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.3)" stroke-width="0.8"/>
      <text x="580" y="255" class="node-tag" fill="#4f5d75" text-anchor="middle">SPARSE LEXICAL</text>
      <text x="650" y="271" class="node-title" text-anchor="middle">Tantivy BM25 Engine</text>
      <text x="650" y="287" class="node-sub" text-anchor="middle">Sub-Millisecond Lexical Match</text>

      <!-- Entity Linker -->
      <rect x="308" y="348" width="184" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="308" y="348" width="184" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="316" y="354" width="60" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.3)" stroke-width="0.8"/>
      <text x="346" y="363" class="node-tag" fill="#4f5d75" text-anchor="middle">ONTOLOGY</text>
      <text x="400" y="379" class="node-title" text-anchor="middle">Medical Entity Linker</text>
      <text x="400" y="395" class="node-sub" text-anchor="middle">SNOMED · RxNorm · LOINC</text>

      <!-- RRF Fusion Engine (FOCAL 2) -->
      <rect x="540" y="348" width="220" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="540" y="348" width="220" height="64" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.5"/>
      <rect x="548" y="354" width="60" height="12" rx="2" fill="transparent" stroke="rgba(235,108,54,0.4)" stroke-width="0.8"/>
      <text x="578" y="363" class="node-tag" fill="#eb6c36" text-anchor="middle">HYBRID RRF</text>
      <text x="650" y="379" class="node-title" text-anchor="middle">Reciprocal Rank Fusion</text>
      <text x="650" y="395" class="node-sub" fill="#eb6c36" text-anchor="middle">k = 60 Score Interleaving</text>

      <!-- Output: Sub-10ms Grounded Evidence -->
      <rect x="308" y="456" width="452" height="56" rx="6" fill="#f5f5f5"/>
      <rect x="308" y="456" width="452" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="316" y="462" width="64" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.3)" stroke-width="0.8"/>
      <text x="348" y="471" class="node-tag" fill="#4f5d75" text-anchor="middle">RETRIEVAL</text>
      <text x="534" y="486" class="node-title" text-anchor="middle">Sub-10ms Verified Evidence Chunks</text>
      <text x="534" y="501" class="node-sub" text-anchor="middle">Harrison&apos;s · KDIGO Guidelines · Zero Idle Cloud RAM Overhead</text>

      <!-- 4. Legend Strip at Bottom -->
      <line x1="40" y1="544" x2="920" y2="544" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
      <text x="40" y="568" class="legend-text" font-weight="600" letter-spacing="0.14em">LEGEND</text>
      
      <rect x="120" y="560" width="12" height="12" rx="2" fill="rgba(235,108,54,0.15)" stroke="#eb6c36" stroke-width="1.2"/>
      <text x="140" y="569" class="legend-text">Core Retrieval &amp; Security Hub</text>

      <rect x="350" y="560" width="12" height="12" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="370" y="569" class="legend-text">Dual Ingestion &amp; Storage</text>

      <line x1="580" y1="566" x2="604" y2="566" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <text x="612" y="569" class="legend-text">Raw Ingestion Stream</text>

      <line x1="770" y1="566" x2="794" y2="566" stroke="#eb6c36" stroke-width="1.5" marker-end="url(#arrow-accent)"/>
      <text x="802" y="569" class="legend-text">Fused Hybrid Retrieval Path</text>
    </svg>
  </div>
</body>
</html>
